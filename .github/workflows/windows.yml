name: Windows build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure (VS2022 + CMake + Python provided by runner)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test actual music cores and audio callbacks
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml
      - name: Package separate runtime and corresponding source
        run: python tools/package.py --build build --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NintendoGameMusicViewer-Windows-x64
          path: dist/NintendoGameMusicViewer-V1.3.1-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NintendoGameMusicViewer-source
          path: dist/NintendoGameMusicViewer-V1.3.1-source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Test-results
          path: build/test-results.xml
          if-no-files-found: ignore
